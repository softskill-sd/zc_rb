<?xml version="1.0" encoding="UTF-8"?>
<features>
  <emulator name="libretro">
    <core name="zc255">
      <system name="zeldaclassic">
        <feature name="CHEATS DEFAULT" value="retroarch.core_options_path" submenu="GAMEPLAY" description="Select the cheats ON or OFF options profile. In RetroArch Quick Menu - Core Options, use the master switch, individual cheats and R2 refill selections. Changes are saved to the selected profile.">
          <choice name="ON" value="./config/ZeldaClassic255/cheats-on.opt" />
          <choice name="OFF" value="./config/ZeldaClassic255/cheats-off.opt" />
        </feature>
        <feature name="REWIND" value="rewind" submenu="GAMEPLAY" description="Rewind can slow gameplay in demanding quests or areas. Choose OFF for faster gameplay. Save states still work with rewind off.">
          <choice name="OFF (FASTER GAMEPLAY)" value="0" />
          <choice name="ON" value="1" />
        </feature>
        <feature name="REWIND CAPTURE INTERVAL" value="retroarch.rewind_granularity" submenu="GAMEPLAY" description="Only used when rewind is ON. Start with 4 frames. Every-frame rewind is more precise but can slow gameplay. Try 8 or 16 for demanding quests.">
          <choice name="4 FRAMES" value="4" />
          <choice name="EVERY FRAME (MORE PRECISE REWIND)" value="1" />
          <choice name="8 FRAMES" value="8" />
          <choice name="16 FRAMES" value="16" />
        </feature>
      </system>
    </core>
  </emulator>
</features>
